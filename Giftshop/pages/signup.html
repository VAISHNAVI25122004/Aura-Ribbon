<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Create your Aura & Ribbon customer account."><title>Create Account | Aura &amp; Ribbon</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/dark-mode.css"><link rel="stylesheet" href="../assets/css/rtl.css"><script defer src="https://unpkg.com/lucide@latest"></script><script defer src="../assets/js/main.js"></script></head><body><main class="auth-page"><a class="logo auth-logo" href="index.html"><span class="logo-mark"><i data-lucide="gift"></i></span>Aura &amp; Ribbon</a><section class="auth-card auth-card-wide"><span class="eyebrow">Join the circle</span><h1>Create Your Account</h1><p>Join us and make every gifting moment more meaningful.</p><form data-signup-form novalidate><div class="auth-fields-two"><label>First Name<input name="firstName" autocomplete="given-name" required></label><label>Last Name<input name="lastName" autocomplete="family-name" required></label></div><label>Email Address<input name="email" type="email" autocomplete="email" required></label><label>Phone Number<input name="phone" type="tel" autocomplete="tel" required></label><div class="auth-fields-two"><label>Password<div class="password-field"><input id="signup-password" name="password" type="password" minlength="8" required><button type="button" class="icon-button" data-toggle="signup-password" aria-label="Show password"><i data-lucide="eye"></i></button></div><small class="password-strength" data-password-strength></small></label><label>Confirm Password<div class="password-field"><input id="confirm-password" name="confirmPassword" type="password" minlength="8" required><button type="button" class="icon-button" data-toggle="confirm-password" aria-label="Show password"><i data-lucide="eye"></i></button></div></label></div><label class="check-label"><input name="terms" type="checkbox"> I agree to the Terms &amp; Conditions.</label><button class="button" type="submit">Create Account <i data-lucide="arrow-right"></i></button><div class="form-message" data-auth-message role="alert"></div></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></section></main></body></html>
